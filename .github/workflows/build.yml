name: Build CIA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
    - uses: actions/checkout@v4

    - name: Install makerom and bannertool
      run: |
        apt-get update -qq && apt-get install -y -qq wget unzip python3
        mkdir -p tools/bin
        wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
        unzip -o -j makerom-v0.19.0-ubuntu_x86_64.zip -d tools/bin/
        wget -q https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
        tar xzf bannertool-1.2.3-linux.tar.gz
        find . -name bannertool -type f -exec cp {} tools/bin/ \;
        chmod +x tools/bin/makerom tools/bin/bannertool
        tools/bin/makerom -v | head -1 || true

    - name: Build
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PWD/tools/bin:$PATH"
        make -j"$(nproc)"

    - name: Upload CIA
      uses: actions/upload-artifact@v4
      with:
        name: re4z-cia
        path: release/re4z.cia
